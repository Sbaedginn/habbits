
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Трекер привычек</title>

  <style>
    :root {
      --bg: #0f1115;
      --card: #1a1d24;
      --card2: #22262f;
      --text: #e8eaf0;
      --muted: #8b93a7;
      --accent: #6c5ce7;
      --accent2: #00d2a0;
      --danger: #ff6b6b;
      --gold: #ffc107;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px 60px;
      background-image:
        radial-gradient(circle at 20% 0%, rgba(108,92,231,.15), transparent 40%),
        radial-gradient(circle at 80% 100%, rgba(0,210,160,.1), transparent 40%);
    }

    button, input {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, #6c5ce7, #00d2a0);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
      margin-top: 6px;
    }

    /* МОТИВАЦИЯ */

    .motivation {
      background: linear-gradient(
        135deg,
        rgba(108,92,231,.25),
        rgba(0,210,160,.15)
      );
      border: 1px solid rgba(108,92,231,.4);
      border-radius: 16px;
      padding: 18px 20px;
      margin-bottom: 24px;
      text-align: center;
      animation: fadeIn .5s ease;
    }

    .motivation .quote {
      font-size: 17px;
      font-style: italic;
      line-height: 1.5;
    }

    .motivation .emoji {
      font-size: 24px;
      display: block;
      margin-bottom: 6px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ДОБАВЛЕНИЕ ПРИВЫЧКИ */

    .add-form {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    .add-form input {
      flex: 1;
      min-width: 0;
      background: var(--card);
      border: 1px solid #2c3140;
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: border .2s;
    }

    .add-form input:focus {
      border-color: var(--accent);
    }

    .add-form button {
      background: linear-gradient(135deg, #6c5ce7, #8e7cff);
      border: none;
      border-radius: 12px;
      padding: 0 22px;
      color: white;
      font-size: 22px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(108,92,231,.4);
      transition: transform .15s, box-shadow .2s;
    }

    .add-form button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(108,92,231,.55);
    }

    .add-form button:active {
      transform: scale(.96);
    }

    /* КАРТОЧКА ПРИВЫЧКИ */

    .habit {
      background: var(--card);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 14px;
      border: 1px solid #242833;
      animation: fadeIn .3s ease;
      transition: border-color .3s;
    }

    .habit.done-today {
      border-color: rgba(0,210,160,.5);
    }

    .habit-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .habit-info {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .check-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid #3a4050;
      background: transparent;
      color: transparent;
      font-size: 20px;
      cursor: pointer;
      flex-shrink: 0;
      transition: all .25s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .check-btn:hover {
      border-color: var(--accent2);
      transform: scale(1.08);
    }

    .check-btn.checked {
      background: linear-gradient(135deg, #00d2a0, #00b088);
      border-color: transparent;
      color: white;
      box-shadow: 0 0 16px rgba(0,210,160,.5);
    }

    .habit-name {
      font-size: 16px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .habit-streak-label {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .habit-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .details-btn {
      background: rgba(108,92,231,.15);
      border: 1px solid rgba(108,92,231,.4);
      color: #a99cff;
      border-radius: 9px;
      padding: 8px 13px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: .2s;
    }

    .details-btn:hover {
      background: rgba(108,92,231,.3);
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .delete-btn {
      background: transparent;
      border: none;
      color: #4a5060;
      font-size: 20px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
      transition: color .2s, background .2s;
      flex-shrink: 0;
    }

    .delete-btn:hover {
      color: var(--danger);
      background: rgba(255,107,107,.1);
    }

    /* ПОЛОСКА ПОСЛЕДНИХ ДНЕЙ */

    .streak-bar {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }

    .day-cell {
      flex: 1;
      height: 34px;
      border-radius: 8px;
      background: var(--card2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: var(--muted);
      transition: all .3s;
      overflow: hidden;
      border: none;
      cursor: pointer;
    }

    .day-cell .day-num {
      font-size: 11px;
      font-weight: 600;
    }

    .day-cell.done {
      background: linear-gradient(135deg, #00d2a0, #00b088);
      color: #06251c;
      font-weight: 700;
    }

    .day-cell.today {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .day-cell:hover {
      filter: brightness(1.2);
    }

    .day-cell:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* СТАТИСТИКА */

    .streak-summary {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-top: 12px;
      font-size: 13px;
      color: var(--muted);
    }

    .streak-summary b {
      color: var(--gold);
      font-size: 15px;
    }

    /* ПУСТОЕ СОСТОЯНИЕ */

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 50px 20px;
      font-size: 15px;
    }

    .empty .big {
      font-size: 48px;
      display: block;
      margin-bottom: 12px;
    }

    /* УВЕДОМЛЕНИЕ */

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--card);
      border: 1px solid rgba(0,210,160,.5);
      color: var(--text);
      padding: 14px 22px;
      border-radius: 14px;
      font-size: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,.5);
      transition: transform .35s cubic-bezier(.2,.9,.3,1.3);
      z-index: 2000;
      max-width: 90vw;
      text-align: center;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    /* =========================
       МОДАЛЬНОЕ ОКНО
    ========================= */

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.75);
      backdrop-filter: blur(7px);
      z-index: 1000;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;

      transition: opacity .25s, visibility .25s;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .modal {
      width: 100%;
      max-width: 650px;
      max-height: 90vh;
      overflow-y: auto;

      background: var(--card);
      border: 1px solid #343a49;
      border-radius: 20px;
      padding: 22px;

      transform: translateY(20px) scale(.98);
      transition: transform .25s;

      box-shadow: 0 20px 70px rgba(0,0,0,.5);
    }

    .modal-overlay.active .modal {
      transform: translateY(0) scale(1);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 15px;
      margin-bottom: 22px;
    }

    .modal-heading {
      min-width: 0;
    }

    .modal-heading h2 {
      font-size: 20px;
      margin-bottom: 5px;
      overflow-wrap: anywhere;
    }

    .modal-heading p {
      font-size: 13px;
      color: var(--muted);
    }

    .modal-close {
      background: var(--card2);
      border: 1px solid #343a49;
      color: var(--muted);
      width: 36px;
      height: 36px;
      border-radius: 10px;
      font-size: 22px;
      cursor: pointer;
      flex-shrink: 0;
      transition: .2s;
    }

    .modal-close:hover {
      color: var(--danger);
      border-color: var(--danger);
    }

    /* НАВИГАЦИЯ КАЛЕНДАРЯ */

    .modal-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .modal-period {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }

    .period-arrow {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;

      background: var(--card2);
      border: 1px solid #343a49;
      color: var(--text);
      border-radius: 10px;
      font-size: 23px;
      cursor: pointer;
      transition: .2s;
    }

    .period-arrow:hover {
      background: rgba(108,92,231,.2);
      border-color: var(--accent);
      color: #b3a8ff;
    }

    .period-arrow:active {
      transform: scale(.93);
    }

    .modal-period-title {
      font-weight: 700;
      flex: 1;
      text-align: center;
      font-size: 16px;
    }

    /* КРАСИВЫЙ ПЕРЕКЛЮЧАТЕЛЬ МЕСЯЦ / ГОД */

    .period-switch {
      display: flex;
      align-items: center;
      position: relative;
      background: #12151b;
      border: 1px solid #303544;
      border-radius: 12px;
      padding: 4px;
      min-width: 180px;
      height: 42px;
      flex-shrink: 0;
    }

    .period-switch button {
      position: relative;
      z-index: 2;
      flex: 1;
      height: 32px;
      border: none;
      background: transparent;
      color: var(--muted);
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: color .25s;
    }

    .period-switch button.active {
      color: white;
    }

    .period-switch button:hover:not(.active) {
      color: var(--text);
    }

    .switch-indicator {
      position: absolute;
      z-index: 1;
      top: 4px;
      left: 4px;
      width: calc(50% - 4px);
      height: 32px;
      border-radius: 9px;

      background: linear-gradient(135deg, #6c5ce7, #8273f5);
      box-shadow: 0 3px 12px rgba(108,92,231,.35);

      transition: transform .28s cubic-bezier(.2,.8,.2,1);
    }

    .period-switch[data-mode="year"] .switch-indicator {
      transform: translateX(100%);
    }

    /* КАЛЕНДАРЬ */

    .modal-calendar {
      min-height: 100px;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0,1fr));
      gap: 5px;
    }

    .calendar-weekday {
      color: var(--muted);
      text-align: center;
      font-size: 11px;
      padding: 5px 0;
    }

    .calendar-day {
      min-width: 0;
      min-height: 38px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: var(--card2);
      color: var(--text);

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;

      font-size: 12px;
      cursor: pointer;
      transition: background .2s, filter .2s;
    }

    .calendar-day:disabled {
      cursor: default;
      opacity: .25;
    }

    .calendar-day.done {
      background: linear-gradient(135deg, #00d2a0, #00b088);
      color: #06251c;
      font-weight: 700;
    }

    .calendar-day.today {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(108,92,231,.2);
    }

    .calendar-day .mark {
      font-size: 10px;
      line-height: 1;
    }

    .calendar-day:not(:disabled):hover {
      filter: brightness(1.2);
    }

    /* ГОДОВОЙ КАЛЕНДАРЬ */

    .year-calendar {
      display: grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 14px;
    }

    .mini-month {
      min-width: 0;
      background: var(--card2);
      padding: 9px;
      border-radius: 10px;
      border: 1px solid #303544;
    }

    .mini-month-title {
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .mini-month .calendar-grid {
      gap: 3px;
    }

    .mini-month .calendar-weekday {
      font-size: 9px;
      padding: 2px 0;
    }

    .mini-month .calendar-day {
      min-height: 28px;
      border-radius: 4px;
      font-size: 10px;
    }

    .mini-month .calendar-day .mark {
      display: none;
    }

    /* ПОДВАЛ КАЛЕНДАРЯ */

    .modal-footer {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid #343a49;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    /* АДАПТИВНОСТЬ */

    @media (max-width: 480px) {
      body {
        padding: 18px 12px 50px;
      }

      .habit {
        padding: 14px;
      }

      .habit-top {
        gap: 8px;
      }

      .habit-info {
        gap: 8px;
      }

      .details-btn {
        padding: 7px 9px;
        font-size: 11px;
      }

      .delete-btn {
        padding: 4px;
      }

      .streak-summary {
        gap: 10px;
        font-size: 12px;
      }

      .modal {
        padding: 15px;
        border-radius: 16px;
      }

      .modal-controls {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
      }

      .modal-period {
        width: 100%;
      }

      .period-switch {
        width: 100%;
      }

      .year-calendar {
        grid-template-columns: repeat(2, minmax(0,1fr));
        gap: 9px;
      }

      .mini-month {
        padding: 6px;
      }

      .mini-month .calendar-day {
        min-height: 25px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <h1>⚡ Трекер привычек</h1>
      <p class="subtitle">Маленькие шаги каждый день</p>
    </header>

    <div class="motivation" id="motivation">
      <span class="emoji">🔥</span>
      <div class="quote" id="quoteText">
        Начни сегодня — и завтра скажешь себе спасибо.
      </div>
    </div>

    <div class="add-form">
      <input
        type="text"
        id="habitInput"
        placeholder="Новая привычка..."
        maxlength="40"
      />
      <button id="addBtn" title="Добавить">+</button>
    </div>

    <div id="habitsList"></div>

  </div>

  <!-- МОДАЛЬНОЕ ОКНО -->

  <div
    class="modal-overlay"
    id="habitModal"
    aria-hidden="true"
  >
    <div
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalHabitName"
    >

      <div class="modal-header">

        <div class="modal-heading">
          <h2 id="modalHabitName">Название привычки</h2>
          <p>История выполнения</p>
        </div>

        <button
          type="button"
          class="modal-close"
          id="modalClose"
          aria-label="Закрыть"
        >
          ×
        </button>

      </div>

      <div class="modal-controls">

        <!-- Навигация по месяцам / годам -->

        <div class="modal-period">

          <button
            type="button"
            class="period-arrow"
            id="periodPrev"
            aria-label="Предыдущий период"
          >
            ‹
          </button>

          <span
            class="modal-period-title"
            id="periodTitle"
          ></span>

          <button
            type="button"
            class="period-arrow"
            id="periodNext"
            aria-label="Следующий период"
          >
            ›
          </button>

        </div>

        <!-- Переключатель месяца и года -->

        <div class="period-switch" id="periodSwitch" data-mode="month">

          <div class="switch-indicator"></div>

          <button
            type="button"
            class="active"
            data-mode="month"
            aria-pressed="true"
          >
            Месяц
          </button>

          <button
            type="button"
            data-mode="year"
            aria-pressed="false"
          >
            Год
          </button>

        </div>

      </div>

      <div
        class="modal-calendar"
        id="calendarContent"
      ></div>

      <div class="modal-footer">
        Нажми на день, чтобы отметить выполнение или снять отметку.
        Будущие даты недоступны.
      </div>

    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    /* ===================== ДАННЫЕ ===================== */

    const STORAGE_KEY = "habit-tracker-v1";
    const BAR_LENGTH = 7;
    const DAY_MS = 24 * 60 * 60 * 1000;

    const MONTH_NAMES = [
      "Январь", "Февраль", "Март", "Апрель",
      "Май", "Июнь", "Июль", "Август",
      "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"
    ];

    const WEEKDAYS = [
      "Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"
    ];

    let calendarDate = new Date();
    calendarDate = new Date(
      calendarDate.getFullYear(),
      calendarDate.getMonth(),
      1
    );

    let calendarMode = "month";
    let selectedHabitId = null;
    let lastFocusedElement = null;

    let habits = load();

    const modal = document.getElementById("habitModal");
    const periodSwitch = document.getElementById("periodSwitch");

    /* ===================== МОТИВАЦИОННЫЕ ФРАЗЫ ===================== */

    const QUOTES = [
      { emoji: "🔥", text: "Начни сегодня — и завтра скажешь себе спасибо." },
      { emoji: "🌱", text: "Успех — это сумма маленьких усилий, повторяемых изо дня в день." },
      { emoji: "💪", text: "Дисциплина — это выбор между тем, что хочешь сейчас, и тем, что хочешь больше всего." },
      { emoji: "🚀", text: "Не останавливайся, когда тяжело. Остановись, когда done." },
      { emoji: "⭐", text: "Ты на один день ближе к своей цели. Не сдавайся!" },
      { emoji: "🧠", text: "Привычка — это не цель, это образ жизни." },
      { emoji: "🌊", text: "Капля камень точит не силой, а постоянством." },
      { emoji: "🏆", text: "Чемпионы тренируются, когда никто не смотрит." },
      { emoji: "⏳", text: "Лучшее время посадить дерево было 20 лет назад. Второе лучшее — сейчас." },
      { emoji: "🎯", text: "Фокус — это сила сказать «нет» сотне хороших идей." },
      { emoji: "🌅", text: "Каждое утро — это новый шанс стать лучше." },
      { emoji: "💎", text: "Трудности — это ступени, а не преграды." }
    ];

    /* ===================== УТИЛИТЫ ===================== */

    function dateKey(d = new Date()) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");

      return `${y}-${m}-${day}`;
    }

    function todayKey() {
      return dateKey();
    }

    function shiftKey(offset) {
      const d = new Date();
      d.setDate(d.getDate() + offset);
      return dateKey(d);
    }

    function uid() {
      return Date.now().toString(36) +
        Math.random().toString(36).slice(2, 7);
    }

    function seed() {
      const demo = [
        {
          id: uid(),
          name: "Зарядка утром 🏃",
          completed: [
            shiftKey(-3),
            shiftKey(-2),
            shiftKey(-1)
          ]
        },
        {
          id: uid(),
          name: "Пить воду 💧",
          completed: [
            shiftKey(-5),
            shiftKey(-4),
            shiftKey(-3),
            shiftKey(-2),
            shiftKey(-1)
          ]
        },
        {
          id: uid(),
          name: "Читать 20 минут 📚",
          completed: [
            shiftKey(-2),
            shiftKey(-1)
          ]
        }
      ];

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(demo)
      );

      return demo;
    }

    function load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);

        if (!raw) return seed();

        const data = JSON.parse(raw);

        if (!Array.isArray(data)) return seed();

        return data
          .filter(h => h && typeof h.name === "string")
          .map(h => ({
            id: h.id || uid(),
            name: h.name,
            completed: Array.isArray(h.completed)
              ? [...new Set(h.completed)]
              : []
          }));

      } catch (e) {
        console.error("Ошибка загрузки:", e);
        return seed();
      }
    }

    function save() {
      try {
        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify(habits)
        );
      } catch (e) {
        console.error("Ошибка сохранения:", e);
        toast("Не удалось сохранить данные");
      }
    }

    /* ===================== STREAK ===================== */

    function currentStreak(habit) {
      const set = new Set(habit.completed);

      let streak = 0;

      const startOffset = set.has(todayKey()) ? 0 : -1;

      for (let i = startOffset; ; i--) {
        if (set.has(shiftKey(i))) {
          streak++;
        } else {
          break;
        }
      }

      return streak;
    }

    function bestStreak(habit) {
      if (!habit.completed.length) return 0;

      const sorted = [...new Set(habit.completed)].sort();

      let best = 1;
      let cur = 1;

      for (let i = 1; i < sorted.length; i++) {
        const prev = new Date(sorted[i - 1] + "T00:00:00");
        const now = new Date(sorted[i] + "T00:00:00");

        const diff = Math.round((now - prev) / DAY_MS);

        if (diff === 1) {
          cur++;
          best = Math.max(best, cur);
        } else {
          cur = 1;
        }
      }

      return best;
    }

    function pluralDays(n) {
      const mod10 = n % 10;
      const mod100 = n % 100;

      if (mod10 === 1 && mod100 !== 11) return "день";

      if (
        mod10 >= 2 &&
        mod10 <= 4 &&
        (mod100 < 10 || mod100 >= 20)
      ) return "дня";

      return "дней";
    }

    /* ===================== МОДАЛЬНОЕ ОКНО ===================== */

    function openHabitCalendar(habitId) {
      const habit = habits.find(h => h.id === habitId);

      if (!habit) return;

      selectedHabitId = habitId;
      lastFocusedElement = document.activeElement;

      const now = new Date();

      calendarDate = new Date(
        now.getFullYear(),
        now.getMonth(),
        1
      );

      calendarMode = "month";

      document.getElementById(
        "modalHabitName"
      ).textContent = habit.name;

      updatePeriodSwitch();

      modal.classList.add("active");
      modal.setAttribute("aria-hidden", "false");

      document.body.style.overflow = "hidden";

      renderCalendar();

      document.getElementById("modalClose").focus();
    }

    function closeHabitCalendar() {
      if (!selectedHabitId) return;

      modal.classList.remove("active");
      modal.setAttribute("aria-hidden", "true");

      document.body.style.overflow = "";

      selectedHabitId = null;

      if (lastFocusedElement?.isConnected) {
        lastFocusedElement.focus();
      }
    }

    /* ===================== ПЕРЕКЛЮЧАТЕЛЬ МЕСЯЦ / ГОД ===================== */

    function updatePeriodSwitch() {
      periodSwitch.dataset.mode = calendarMode;

      periodSwitch.querySelectorAll("button").forEach(button => {
        const active = button.dataset.mode === calendarMode;

        button.classList.toggle("active", active);

        button.setAttribute(
          "aria-pressed",
          String(active)
        );
      });
    }

    periodSwitch.querySelectorAll("button").forEach(button => {
      button.addEventListener("click", () => {
        const newMode = button.dataset.mode;

        if (newMode === calendarMode) return;

        calendarMode = newMode;

        updatePeriodSwitch();
        renderCalendar();
      });
    });

    /* ===================== КАЛЕНДАРЬ ===================== */

    function renderCalendar() {
      if (!selectedHabitId) return;

      const habit = habits.find(
        h => h.id === selectedHabitId
      );

      if (!habit) {
        closeHabitCalendar();
        return;
      }

      const title = document.getElementById("periodTitle");
      const content = document.getElementById("calendarContent");

      const year = calendarDate.getFullYear();
      const month = calendarDate.getMonth();

      title.textContent =
        calendarMode === "month"
          ? `${MONTH_NAMES[month]} ${year}`
          : String(year);

      if (calendarMode === "month") {
        content.innerHTML = renderMonthGrid(
          habit,
          year,
          month,
          false
        );
      } else {
        let months = '<div class="year-calendar">';

        for (let m = 0; m < 12; m++) {
          months += `
            <div class="mini-month">
              <div class="mini-month-title">
                ${MONTH_NAMES[m]}
              </div>

              ${renderMonthGrid(habit, year, m, true)}
            </div>
          `;
        }

        months += "</div>";

        content.innerHTML = months;
      }

      content
        .querySelectorAll(".calendar-day[data-date]")
        .forEach(button => {
          button.addEventListener("click", () => {
            const key = button.dataset.date;

            if (key && selectedHabitId) {
              toggleHabit(selectedHabitId, key);
            }
          });
        });
    }

    function renderMonthGrid(habit, year, month, compact) {
      const firstWeekday =
        (new Date(year, month, 1).getDay() + 6) % 7;

      const daysInMonth =
        new Date(year, month + 1, 0).getDate();

      const today = todayKey();
      const completed = new Set(habit.completed);

      let html = '<div class="calendar-grid">';

      html += WEEKDAYS.map(day => `
        <div class="calendar-weekday">${day}</div>
      `).join("");

      for (let i = 0; i < firstWeekday; i++) {
        html += "<div></div>";
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const date = new Date(year, month, day);
        const key = dateKey(date);

        const isDone = completed.has(key);
        const isToday = key === today;
        const isFuture = key > today;

        const classes = [
          "calendar-day",
          isDone ? "done" : "",
          isToday ? "today" : ""
        ].filter(Boolean).join(" ");

        const mark = isDone
          ? '<span class="mark">✓</span>'
          : '<span class="mark">&nbsp;</span>';

        html += `
          <button
            type="button"
            class="${classes}"
            data-date="${key}"
            title="${key}${isDone ? " — выполнено" : ""}"
            aria-pressed="${isDone}"
            ${isFuture ? "disabled" : ""}
          >
            <span>${day}</span>
            ${compact ? "" : mark}
          </button>
        `;
      }

      html += "</div>";

      return html;
    }

    /* ===================== НАВИГАЦИЯ ===================== */

    function changeCalendarPeriod(direction) {
      if (calendarMode === "month") {
        calendarDate = new Date(
          calendarDate.getFullYear(),
          calendarDate.getMonth() + direction,
          1
        );
      } else {
        calendarDate = new Date(
          calendarDate.getFullYear() + direction,
          calendarDate.getMonth(),
          1
        );
      }

      renderCalendar();
    }

    /* ===================== РЕНДЕР ПРИВЫЧЕК ===================== */

    function render() {
      const list = document.getElementById("habitsList");

      list.innerHTML = "";

      if (selectedHabitId) {
        const exists = habits.some(
          h => h.id === selectedHabitId
        );

        if (exists) {
          renderCalendar();
        } else {
          closeHabitCalendar();
        }
      }

      if (!habits.length) {
        list.innerHTML = `
          <div class="empty">
            <span class="big">🌱</span>
            Пока нет привычек.<br>
            Добавь первую и начни свой путь!
          </div>
        `;

        return;
      }

      habits.forEach(habit => {
        list.appendChild(renderHabit(habit));
      });
    }

    function renderHabit(habit) {
      const el = document.createElement("div");

      const doneToday = habit.completed.includes(todayKey());

      el.className =
        "habit" + (doneToday ? " done-today" : "");

      const streak = currentStreak(habit);
      const best = bestStreak(habit);
      const total = new Set(habit.completed).size;

      const cells = [];

      for (let i = BAR_LENGTH - 1; i >= 0; i--) {
        const key = shiftKey(-i);
        const isDone = habit.completed.includes(key);
        const isToday = i === 0;

        const d = new Date();
        d.setDate(d.getDate() - i);

        cells.push(`
          <button
            type="button"
            class="day-cell ${isDone ? "done" : ""} ${isToday ? "today" : ""}"
            data-date="${key}"
            title="Отметить ${key}"
            aria-pressed="${isDone}"
          >
            <span class="day-num">${d.getDate()}</span>
            <span>${isDone ? "✓" : ""}</span>
          </button>
        `);
      }

      el.innerHTML = `
        <div class="habit-top">

          <div class="habit-info">

            <button
              class="check-btn ${doneToday ? "checked" : ""}"
              data-action="toggle"
              type="button"
              aria-label="Отметить выполнение за сегодня"
              aria-pressed="${doneToday}"
            >
              ✓
            </button>

            <div style="min-width:0">

              <div class="habit-name">
                ${escapeHtml(habit.name)}
              </div>

              <div class="habit-streak-label">
                ${
                  streak > 0
                    ? `🔥 Серия: ${streak} ${pluralDays(streak)}`
                    : "Начни серию сегодня!"
                }
              </div>

            </div>

          </div>

          <div class="habit-actions">

            <button
              class="details-btn"
              data-action="details"
              type="button"
            >
              Подробнее
            </button>

            <button
              class="delete-btn"
              data-action="delete"
              type="button"
              title="Удалить"
              aria-label="Удалить привычку"
            >
              🗑
            </button>

          </div>

        </div>

        <div class="streak-bar">
          ${cells.join("")}
        </div>

        <div class="streak-summary">
          <span>🔥 Текущая: <b>${streak}</b></span>
          <span>🏆 Лучшая: <b>${best}</b></span>
          <span>📅 Всего: <b>${total}</b></span>
        </div>
      `;

      // Отметка сегодня

      el.querySelector(
        '[data-action="toggle"]'
      ).addEventListener("click", () => {
        toggleHabit(habit.id);
      });

      // Отметки последних семи дней

      el.querySelectorAll(".day-cell").forEach(cell => {
        cell.addEventListener("click", () => {
          toggleHabit(habit.id, cell.dataset.date);
        });
      });

      // Удаление

      el.querySelector(
        '[data-action="delete"]'
      ).addEventListener("click", () => {
        deleteHabit(habit.id);
      });

      // Подробнее

      el.querySelector(
        '[data-action="details"]'
      ).addEventListener("click", () => {
        openHabitCalendar(habit.id);
      });

      return el;
    }

    /* ===================== БЕЗОПАСНЫЙ ВЫВОД ===================== */

    function escapeHtml(s) {
      return String(s).replace(
        /[&<>"']/g,
        c => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        })[c]
      );
    }

    /* ===================== ДЕЙСТВИЯ ===================== */

    function addHabit() {
      const input = document.getElementById("habitInput");
      const name = input.value.trim();

      if (!name) {
        input.focus();
        return;
      }

      habits.push({
        id: uid(),
        name,
        completed: []
      });

      input.value = "";

      save();
      render();
      showMotivation();

      toast("Привычка добавлена! Погнали 🚀");

      input.focus();
    }

    function toggleHabit(id, key = todayKey()) {
      const habit = habits.find(h => h.id === id);

      if (!habit) return;

      // За будущие даты отмечать нельзя

      if (key > todayKey()) return;

      const idx = habit.completed.indexOf(key);

      if (idx === -1) {
        habit.completed.push(key);

        toast(
          key === todayKey()
            ? "Отмечено за сегодня!"
            : `Отмечено: ${key}`
        );

      } else {
        habit.completed.splice(idx, 1);
        toast("Отметка снята");
      }

      save();
      render();
    }

    function deleteHabit(id) {
      const habit = habits.find(h => h.id === id);

      if (!habit) return;

      if (!confirm(`Удалить «${habit.name}»?`)) {
        return;
      }

      habits = habits.filter(h => h.id !== id);

      save();
      render();

      toast("Привычка удалена");
    }

    /* ===================== МОТИВАЦИЯ ===================== */

    function showMotivation() {
      const q = QUOTES[
        Math.floor(Math.random() * QUOTES.length)
      ];

      const box = document.getElementById("motivation");

      box.querySelector(".emoji").textContent = q.emoji;

      document.getElementById(
        "quoteText"
      ).textContent = q.text;

      box.style.animation = "none";

      void box.offsetWidth;

      box.style.animation = "fadeIn .5s ease";
    }

    /* ===================== TOAST ===================== */

    let toastTimer;

    function toast(msg) {
      const t = document.getElementById("toast");

      t.textContent = msg;
      t.classList.add("show");

      clearTimeout(toastTimer);

      toastTimer = setTimeout(() => {
        t.classList.remove("show");
      }, 2400);
    }

    /* ===================== ИНИЦИАЛИЗАЦИЯ ===================== */

    document
      .getElementById("addBtn")
      .addEventListener("click", addHabit);

    document
      .getElementById("habitInput")
      .addEventListener("keydown", event => {
        if (event.key === "Enter") {
          addHabit();
        }
      });

    // Предыдущий период

    document
      .getElementById("periodPrev")
      .addEventListener("click", () => {
        changeCalendarPeriod(-1);
      });

    // Следующий период

    document
      .getElementById("periodNext")
      .addEventListener("click", () => {
        changeCalendarPeriod(1);
      });

    // Закрытие крестиком

    document
      .getElementById("modalClose")
      .addEventListener("click", closeHabitCalendar);

    // Закрытие кликом за пределами окна

    modal.addEventListener("click", event => {
      if (event.target === modal) {
        closeHabitCalendar();
      }
    });

    // Закрытие клавишей Escape

    document.addEventListener("keydown", event => {
      if (
        event.key === "Escape" &&
        selectedHabitId !== null
      ) {
        closeHabitCalendar();
      }
    });

    /* ===================== СМЕНА ДНЯ ===================== */

    let lastDay = todayKey();

    setInterval(() => {
      const now = todayKey();

      if (now !== lastDay) {
        lastDay = now;

        render();

        toast("🌅 Новый день — новые возможности!");
      }
    }, 60000);

    /* ===================== ЗАПУСК ===================== */

    render();
    showMotivation();

  </script>
</body>
</html>
